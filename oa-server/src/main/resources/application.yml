# ============================================================================
# 集团OA审批系统 · 后端配置（环境配置层，doc/tech-design.md §7）
# ----------------------------------------------------------------------------
# 运行期可配置项（决议模式、闸门次数、补件上限、保留期等）由管理后台维护，不进本文件。
# 敏感值一律用环境变量注入：OA_DB_PASSWORD / OA_REDIS_PASSWORD。
# ============================================================================
server:
  port: 8080
  shutdown: graceful
  error:
    # AC-41：错误信息不泄露内部细节（统一走 GlobalExceptionHandler + traceId）
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel:
      enabled: false
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
  tomcat:
    threads:
      max: 200

spring:
  application:
    name: oa-server
  profiles:
    # 未显式指定 profile 时使用 dev；生产用 --spring.profiles.active=prod
    default: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/oa?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: oa
    password: ${OA_DB_PASSWORD:oa}
    hikari:
      pool-name: oaHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${OA_REDIS_PASSWORD:}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  # ---------------------------------------------------------------------------
  # Flyway：迁移脚本由主控生成（V1__schema.sql 27 表 / V2__dict_seed.sql / V3__templates.sql），
  # 触发器不在迁移内（Flyway 不识别 mysql 客户端的 DELIMITER），由 ImmutableTriggerInitializer 幂等创建。
  # 注意：脚本为 UTF-8，必须显式声明 encoding，否则中文注释会乱码。
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: baseline-existing-schema
    validate-on-migrate: true
    out-of-order: false
    placeholder-replacement: false
    clean-disabled: true
  servlet:
    multipart:
      # 单文件 ≤50MB、单次 ≤20 个（REQ/§5.4）；Nginx client_max_body_size 需同步
      max-file-size: 50MB
      max-request-size: 1024MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.oa.**.domain
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    default-statement-timeout: 30
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
      # 仅基础数据（sys_org/sys_user/sys_role/字典/模板）带 deleted_at；审批类数据一律不删除
      logic-delete-field: deletedAt
      logic-not-delete-value: "null"
      logic-delete-value: "now()"

# ---------------------------------------------------------------------------
# 本工程自有配置（OaProperties）
# ---------------------------------------------------------------------------
oa:
  web:
    # 系统标题（非敏感；GET /api/v1/auth/client-config 下发，与 oa-web 的 VITE_APP_TITLE 对齐）
    title: 集团OA审批系统
    # 前端统一 API 前缀（只下发相对路径，绝对地址由浏览器按当前来源解析）
    api-base-url: /api/v1
    # 生产必须关闭（前后端同源经 Nginx 反代）
    cors-enabled: false
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
    # 认证拦截器排除路径（登录、口令策略、健康检查等）。
    # 注意：/api/v1/auth/client-config 与 /api/v1/auth/unlock 等**不走白名单**，
    # 前者用方法级 @Anonymous 放行（只对这一个方法生效，边界比路径白名单小）。
    permit-all:
      - /api/v1/auth/login
      - /api/v1/auth/password-policy
      - /api/v1/auth/lock-status
      - /actuator/**
      - /error
  # 水印（REQ-USER-004 / AC-44）：透明度区间 5%–8% 是设计常量（WatermarkPolicy 持有），
  # 这里的值会在下发前被夹紧到该区间；越界配置不会放行到前端。
  watermark:
    enabled: true
    opacity: 0.06
  session:
    cookie-name: OA_SESSION
    # 会话存储：redis（生产）；memory 为单测/降级预留（需自行装配 Bean）
    store: redis
    max-devices: 3          # 同时在线设备上限（REQ-USER-003）
    remember-me-days: 7     # 「记住我」有效期（REQ-USER-002）
    temporary-hours: 12     # 未勾选「记住我」= 会话级（库中仍记 12 小时兜底）
    cookie-secure: true     # 生产 HTTPS 必须 true；dev 覆盖为 false
    cookie-same-site: Lax
    cookie-path: /
    touch-interval-seconds: 300
  scope:
    # 归口部门（集团财务部）：优先用 id；未配置时按名称兜底查询 sys_org
    finance-dept-id:
    finance-dept-name: 财务部
    finance-dept-path:
    # 财务部「归口部门」分支默认关闭：flow_instance.owner_dept_id 恒为集团财务部，
    # 无条件织入等于放开全部单据，与 PRD §5.3「不涉及费用且未经流转的事项单不可见」冲突
    finance-owner-dept-branch-enabled: false
    # 受控表的 SELECT 必须带 /* @dataScope(...) */ 标记，否则拦截（评审阻断项）
    enforce-unmarked-select: true
    exempt-statement-ids:
      - com.oa.identity.infra.SysUserMapper.selectByAccount
      # 账号/工号唯一性判重（系统口径）：唯一性是全局约束，与数据域无关；只返回 COUNT、不返回行数据，
      # 不构成数据域旁路（数据域读取限制一行未动）。判重若被数据域裁剪 → 域外重复只能靠数据库唯一键兜住
      # （工号更无库唯一键，会被静默写入）。守卫：DataScopeMapperGuardTest
      - com.oa.identity.infra.SysUserMapper.countByAccountSystem
      - com.oa.identity.infra.SysUserMapper.countByEmployeeNoSystem
      - com.oa.identity.infra.SysUserSessionMapper
      - com.oa.identity.infra.SysLoginLogMapper
      - com.oa.authz.infra.DataScopeMapper
    tables:
      - table: flow_instance
        alias: i
        kind: INSTANCE
      - table: form_data
        alias: f
        kind: INSTANCE
      - table: flow_task
        alias: t
        kind: INSTANCE
      - table: flow_routing
        alias: r
        kind: INSTANCE
      - table: sys_user
        alias: u
        kind: USER
  identity:
    # 组织与人员（阶段 1.1/1.2）：在途/待办命中时是否「拒绝」操作
    # 默认 true = 阻断（AC-11/AC-12、PRD 5.5、import-spec §8.1/§8.2 强制要求）
    # 置 false = 仅告警放行，但仍返回影响清单（过渡期用法，验收前必须恢复 true）
    block-on-inflight: true
  security:
    password-min-length: 8      # ≥8 位且含字母与数字（REQ-NFR-005）
    bcrypt-strength: 12         # 文档要求 ≥10
    login-max-failures: 5       # 连续失败 5 次
    login-lock-minutes: 15      # 锁定 15 分钟
    login-fail-window-minutes: 15
    # ---------------------------------------------------------------------------
    # 手机号字段级加密（阶段 1.7，AES-256-GCM）
    #   phone-key      活动密钥（32 字节 Base64 或 hex）——生产**只能**由环境变量注入；
    #                  为空且 phone-key-file 也读不到时，应用启动直接失败（fail-fast，
    #                  绝不静默降级为明文存储，PRD §5.3 / REQ-NFR-005）。
    #   phone-key-file 活动密钥的文件来源（首行，支持 # 注释）；dev 用它免去每次注入环境变量。
    #   phone-key-id   活动密钥的 keyId（写入密文 v1:<keyId>:...，供将来轮换）。
    #   phone-keys     历史密钥 { keyId: 密钥材料 }，仅用于解密（轮换期新旧密文共存）。
    # 生成密钥示例：openssl rand -base64 32
    # ---------------------------------------------------------------------------
    phone-key: ${OA_PHONE_KEY:}
    phone-key-file: ${OA_PHONE_KEY_FILE:}
    phone-key-id: ${OA_PHONE_KEY_ID:k1}
    phone-keys: {}
  authz:
    export:
      # 金额列导出开关（PRD §5.3 / AC-18 为准）。
      #
      # **默认 true**：PRD §5.3 原文是「合同金额、资金金额对非财务类角色只读展示，不可导出；
      # 导出功能仅系统管理员与财务角色可用」，AC-18 进一步明确「非财务角色导出按钮不存在/不可用
      # （系统管理员与财务角色可用）」。因此**正确的闸门是导出端点的角色权限**，
      # 而不是把金额从所有人的导出物里一律剔除——后者会让财务角色也导不出金额，与 PRD 相悖。
      # 置 true 时：仅系统管理员与 finance_owner 可随导出拿到金额列（其余角色在导出入口即 403），
      # 且导出行为写入审计日志（REQ-AUTH-003）。
      # 置 false 仅在需要「极端保守形态（任何人导出的文件都不含金额）」时使用，属**收紧**而非 PRD 要求。
      amount-enabled: true
  db:
    immutable-triggers-enabled: true
    immutable-triggers-location: classpath:db/trigger/immutable-triggers.sql
  jackson:
    serialize-big-decimal-as-string: true   # 金额 DECIMAL(18,2) 一律字符串，禁止浮点
    serialize-long-as-string: true          # BIGINT UNSIGNED 主键防 JS 精度丢失
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

logging:
  level:
    root: INFO
    com.oa: INFO
    org.springframework.jdbc.core: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
