# ============================================================================
# dev profile：本机联调覆盖项（MySQL / Redis 均为本机默认端口）
# 启动：mvn spring-boot:run 或 java -jar target/oa-server-0.1.0-SNAPSHOT.jar --spring.profiles.active=dev
# ============================================================================
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/oa?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${OA_DB_USERNAME:root}
    password: ${OA_DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: ${OA_REDIS_HOST:127.0.0.1}
      port: ${OA_REDIS_PORT:6379}
  flyway:
    # 开发期允许在已有库上增量执行；生产请勿开启 clean
    baseline-on-migrate: true
  devtools:
    restart:
      enabled: false

oa:
  web:
    # 本机 Vite 跨域联调；生产必须 false（前后端同源经 Nginx 反代）
    cors-enabled: true
    # 允许来源必须与 oa-web/vite.config.ts 的 server.port 一致（当前为 5273）。
    # 2026-10-02 实测教训：二者不一致时，浏览器会带 Origin 头，Spring 直接返回
    # 403 Invalid CORS request，而 curl（不带 Origin）却始终 200 —— 表现为“接口明明是好的，页面就是登不进去”。
    allowed-origins:
      - http://127.0.0.1:5273
      - http://localhost:5273
      # 兼容 Vite 默认端口（若改回 5173 仍可用）
      - http://localhost:5173
      - http://127.0.0.1:5173
  session:
    # 本机多为 http，Secure Cookie 会写不进去 → dev 关闭（生产必须 true）
    cookie-secure: false
  db:
    # 本机由开发者自己起 MySQL 时保持开启，幂等创建 4 个触发器
    immutable-triggers-enabled: true

logging:
  level:
    com.oa: DEBUG
    # 打印 MyBatis 执行的 SQL（含织入后的数据域片段），便于核对越权口径；生产必须关闭
    com.oa.identity.infra: DEBUG
    org.mybatis: INFO
    org.springframework.web: INFO
