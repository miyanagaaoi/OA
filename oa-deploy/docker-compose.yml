# 集团OA审批系统 · 单机私有化编排（Docker Compose）
#
# 用法：
#   cp .env.example .env    # 首次：填写口令与密钥（.env 已在 .gitignore 中，不入库）
#   docker compose up -d --build
#   docker compose logs -f app
#
# 说明：
#   - 对应技术方案 D4「Docker Compose 单机」与 §7 部署拓扑（Nginx → 应用 → MySQL/Redis/本地文件卷）
#   - **离线交付**：先在联网机器执行 `docker compose build` 与 `docker save`，把镜像 tar + 本文件拷入内网
#   - 时间与时区统一 Asia/Shanghai；数据库字符集 utf8mb4（与 doc/data-model.md 一致）

name: oa

services:
  mysql:
    image: mysql:8.0
    container_name: oa-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max_connections=300
      - --log-bin-trust-function-creators=1   # 允许创建触发器（不可篡改约束，AC-20）
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oa}
      MYSQL_USER: ${MYSQL_USER:-oa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backup:/backup            # 备份输出目录（每日全量保留 30 天）
    ports:
      - "127.0.0.1:3306:3306"       # 仅本机可连，禁止对公网暴露
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: oa-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中设置}"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"       # 会话/限流/幂等/调度锁，禁止对公网暴露
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ../oa-server
      dockerfile: Dockerfile
    image: oa-server:${APP_TAG:-local}
    container_name: oa-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-oa}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-oa}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置}
      # 附件与签名图的本地私有存储（技术方案 D6：本地私有目录 + 鉴权下载）
      OA_STORAGE_ROOT: /data/oa
      OA_STORAGE_MAX_FILE_MB: "50"
      OA_TRIGGER_AUTO_CREATE: "true"     # 启动时幂等创建不可篡改触发器
      OA_LOG_LEVEL: ${OA_LOG_LEVEL:-INFO}
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1536m -XX:+UseG1GC -Duser.timezone=Asia/Shanghai}
    volumes:
      - oa-files:/data/oa
      - ./config:/app/config:ro          # 运行期可配置项与日志策略
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  nginx:
    image: nginx:1.24-alpine
    container_name: oa-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"        # 仅用于跳转 443
      - "443:443"
    volumes:
      - ./nginx/oa.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro          # 放 fullchain.pem / privkey.pem（内网 CA 或自签）
      - ../oa-web/dist:/usr/share/nginx/html:ro    # 前端构建产物（pnpm build）
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

volumes:
  mysql-data:
  redis-data:
  oa-files:        # 附件与手写签名图；**必须纳入每日备份**
