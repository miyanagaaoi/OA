# 集团OA审批系统 · Nginx 站点配置（私有化单机）
# 对应技术方案 §7 部署拓扑与 §6 安全（HTTPS + HSTS + 上传限制 + 静态资源本地化）

upstream oa_app {
    server app:8080;
    keepalive 32;
}

# HTTP → HTTPS 强制跳转（REQ-NFR-005 全站 HTTPS）
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 内网 CA 或自签证书；生产替换为集团 CA 签发
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头（AC-41 安全基线）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 全本地资源：禁止任何外部来源（私有化无公网）
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'self'" always;

    client_max_body_size 60m;      # 单文件上限 50MB（doc/enums.md §12.1），留余量
    client_body_timeout  300s;
    send_timeout         300s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1k;

    # 健康检查（容器 healthcheck 用，免鉴权且不写日志）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass         http://oa_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 审计需要真实客户端信息（sys_log.ip / user_agent）
        proxy_set_header   X-Client-User-Agent $http_user_agent;
    }

    # 附件上传/下载走同一 API 前缀，单独放宽超时
    location /api/v1/attachments/ {
        proxy_pass         http://oa_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;      # 大文件直传
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    location /actuator/health {
        proxy_pass http://oa_app;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }

    # ---------- 前端静态资源（Vue 构建产物）----------
    root /usr/share/nginx/html;
    index index.html;

    # 带指纹的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退（/login、/task/:id 等由前端路由接管）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 打印预览：同一入口，前端用 A4 样式渲染（正式打印签名栏空栏）
    location /print/ {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # 禁止访问隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
    }
}
