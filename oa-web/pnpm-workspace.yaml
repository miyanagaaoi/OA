# pnpm 11 起，依赖安装策略写在 pnpm-workspace.yaml（package.json 的 "pnpm" 字段不再被读取）
#
# allowBuilds：pnpm 10+ 默认不执行依赖的安装脚本。
#   esbuild 需要安装脚本落地平台二进制，否则 Vite 构建直接失败；
#   vue-demi 的 postinstall 用于切换 Vue 2/3 适配层。
#   私有化离线交付时同样依赖这份白名单，不依赖公网。
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true

# 关闭「最小发布年龄」供应链策略：本机通过代理安装，且本项目锁定了明确版本。
# 若交付环境有更严格的供应链要求，请改回正整数（单位分钟），
# 并相应下调 @types/node / vue-tsc 的版本。
minimumReleaseAge: 0

# 仅本包，不做 monorepo 分包
packages:
  - '.'
