name: docs-ci

# 文档与交付脚本的持续校验：
# 把「文档 = 真源」这件事变成可执行的检查，任何一次提交都验证：
#   DDL 结构、初始化 SQL 与文档一致、流程模板 SQL 合法、导入模板可解析、设计规范合规。
# 代码工程（oa-server / oa-web）接入后，在其自己的 workflow 中追加构建与单测。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  doc-and-artifact-checks:
    name: 文档与交付产物校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 设计规范校验（DESIGN.md）
        run: node tools/validate-design-md.js DESIGN.md

      - name: 数据模型 DDL 校验（27 张表 / 主键 / 外键 / 金额非浮点）
        run: node tools/check-ddl.js doc/data-model.md

      - name: 初始化 SQL 与文档一致性校验（不落盘）
        run: node tools/gen-init-sql.js --check

      - name: 流程模板 SQL 校验（四类模板 × 7 节点 / JSON 合法 / 闸门口径）
        run: node tools/check-templates-sql.js oa-deploy/sql/03-templates.sql

      - name: 导入模板校验（组织 / 人员 / 负责人 / 一人多岗 / 角色分配）
        run: node tools/check-import-csv.js oa-deploy/import

      - name: Flyway 迁移与交付脚本一致性校验（触发器段拆分 + V4 权限树）
        run: node tools/build-flyway-migrations.js --check

      - name: 权限树种子校验（9 角色 / 94 权限项 / 祖先闭包 / 越权断言）
        run: node tools/check-permission-seed.js oa-deploy/sql/04-permissions.sql

      - name: 权限树种子与生成器一致性（防手工改产物）
        run: node tools/gen-permission-seed.js --check

      - name: 校验汇总
        if: always()
        run: echo "全部检查完成；任一上游步骤失败即视为本次提交不合规。"

  backend:
    name: 后端构建与单测（oa-server）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oa-server
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 编译与单测（数据域 SQL / 三态白名单 / 会话锁定 / Mapper 解析）
        run: mvn -B test

      - name: 打包（不跑测试，验证可交付）
        run: mvn -B -q -DskipTests package

  frontend:
    name: 前端类型检查与构建（oa-web）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oa-web
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装依赖（锁定文件，允许构建脚本见 pnpm-workspace.yaml）
        run: pnpm install --frozen-lockfile

      - name: 类型检查（vue-tsc）
        run: pnpm typecheck

      - name: 构建（vite build）
        run: pnpm build
